name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s labs/week3_agent_harness -v
      - run: python scripts/update_leaderboard.py --check
      - name: Remove generated server log
        run: python -c "from pathlib import Path; Path('starter/mcp_servers.log').unlink(missing_ok=True)"
      - run: python scripts/check_repository.py
